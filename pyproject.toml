[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "brighteyes-mcs"
version = "1.1.1"
description = "Microscope control software for image-scanning microscopy"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
    { name = "Mattia Donato", email = "mattia.donato@iit.it" },
    { name = "Istituto Italiano di Tecnologia" },
]
maintainers = [
    { name = "Mattia Donato", email = "mattia.donato@iit.it" },
]
keywords = [
    "microscopy",
    "image scanning microscopy",
    "fluorescence microscopy",
    "FPGA",
    "scientific imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "brighteyes-mcs-cylibs>=1.0.0",
    "brighteyes-mcs-reader>=0.1.0",
    "pyqtdarktheme==0.1.7",
    "pyqtgraph==0.13.7",
    "PySide6>=6.10.1",
    "numpy",
    "nifpga",
    "h5py",
    "scipy",
    "imageio",
    "qtconsole",
    "psutil",
    "uvicorn",
    "nifpga-fast-fifo-recv>=0.102.0",
    "matplotlib",
    "fastapi",
    "requests",
    "python-multipart",
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
ao = ["pyserial"]
all = [
    "pyserial",
]

[project.urls]
Homepage = "https://github.com/VicidominiLab/BrightEyes-MCS"
Documentation = "https://github.com/VicidominiLab/BrightEyes-MCS/blob/HEAD/docs/README.md"
Repository = "https://github.com/VicidominiLab/BrightEyes-MCS.git"
Issues = "https://github.com/VicidominiLab/BrightEyes-MCS/issues"

[tool.uv.build-backend]
module-name = "brighteyes_mcs"
module-root = "src"
source-exclude = ["*.lvbitx", "*.exe"]

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["test/Sandbox"]
addopts = ["-m", "not qt_isolated"]
markers = [
    "integration: process or storage integration tests",
    "qt: tests requiring a Qt application",
    "hardware: tests requiring connected acquisition hardware",
    "qt_isolated: Qt tests run in a dedicated interpreter on Windows/Python 3.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/brighteyes_mcs/ui/qt/*_design.py", "src/brighteyes_mcs/plugins/**/*_design.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/brighteyes_mcs/ui/qt/**" = ["N"]
"src/brighteyes_mcs/plugins/**" = ["N"]
"test/**" = ["N"]

[tool.ruff.format]
exclude = [
    "src/brighteyes_mcs/ui/qt/**",
    "src/brighteyes_mcs/plugins/**",
    "test/**",
    "scripts/**",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["brighteyes_mcs_cylibs.*", "h5py.*", "psutil.*", "pyqtgraph.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.2",
]
